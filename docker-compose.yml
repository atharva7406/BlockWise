version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: railplan_postgres
    restart: always
    environment:
      POSTGRES_USER: railplan_user
      POSTGRES_PASSWORD: railplan_pass
      POSTGRES_DB: railplan_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railplan_user -d railplan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railplan_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://railplan_user:railplan_pass@db:5432/railplan_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railplan_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
